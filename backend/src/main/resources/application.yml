spring:
  application:
    name: orderflow
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/orderflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:orderflow}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      accept-float-as-int: false
    time-zone: Asia/Shanghai
server:
  port: ${PORT:8080}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
app:
  analytics:
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:10}
  jwt-secret: ${JWT_SECRET}
  jwt-ttl: PT2H
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  order:
    payment-timeout: PT15M
    timeout-scan-interval: 60000
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
